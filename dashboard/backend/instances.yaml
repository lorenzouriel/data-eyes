# Data Eyes dashboard — fleet registry seed.
#
# One entry per monitored SQL Server instance, with a direct connection
# string (app/diagnostics.py / app/mssql_client.py query it directly — no
# MCP server sits in between; MCP is reserved for agent use, see mcp/).
#
# This file is a one-time seed: on startup, any entry whose `name` isn't
# already registered gets inserted, then the dashboard's own instance
# registry (managed via the UI / the /api/instances routes) takes over as
# the live source of truth. Editing this file after first boot has no
# effect on an instance that already exists.
#
# NEVER commit real credentials here in a shared repo — this file ships
# with placeholder connection strings; fill in real ones locally, or add
# instances entirely through the UI instead.

instances:
  - name: dev
    label: "Dev"
    mssql_connection_string: "Driver={ODBC Driver 17 for SQL Server};Server=dev-sql,1433;Database=master;UID=data_eyes_ro;PWD=change-me"
    environment: development
  - name: staging
    label: "Staging"
    mssql_connection_string: "Driver={ODBC Driver 17 for SQL Server};Server=staging-sql,1433;Database=master;UID=data_eyes_ro;PWD=change-me"
    environment: staging
  - name: prod1
    label: "Prod 1 (AG Primary)"
    mssql_connection_string: "Driver={ODBC Driver 17 for SQL Server};Server=prod1-sql,1433;Database=master;UID=data_eyes_ro;PWD=change-me"
    environment: production
  - name: prod2
    label: "Prod 2 (AG Secondary)"
    mssql_connection_string: "Driver={ODBC Driver 17 for SQL Server};Server=prod2-sql,1433;Database=master;UID=data_eyes_ro;PWD=change-me"
    environment: production
