server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Same-origin proxy to the backend so the session cookie works without
    # CORS in production — see dashboard/backend/app/config.py CORS_ALLOW_ORIGINS,
    # which is only needed for the separate-origin Vite dev server.
    location /api/ {
        proxy_pass http://dashboard-backend:8090/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cookie_path / /;
    }
}
