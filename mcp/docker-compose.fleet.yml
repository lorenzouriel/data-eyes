# Fleet topology for the Data Eyes dashboard (rearchitecture plan §2.3,
# Option A): one data-eyes-mcp container per monitored SQL Server instance,
# each with its own connection string and HTTP port. Mirrors the
# Dev/Staging/Prod1-AG/Prod2-AG topology monitor/'s Grafana datasources used
# (see monitor/grafana/datasources.yml, monitor/docs/availability_groups.md).
#
# Setup: for each instance below, copy .env.example to the matching
# .env.<name> file (.env.dev, .env.staging, .env.prod1, .env.prod2) and fill
# in that instance's MSSQL_CONNECTION_STRING.
#
# Run alongside the dashboard — both this file's services and
# dashboard/docker-compose.yml join the shared data-eyes-net network, which
# must exist first:
#   docker network create data-eyes-net
#   docker compose -f mcp/docker-compose.fleet.yml up -d
#   docker compose -f dashboard/docker-compose.yml up -d
#
# This file is additive to docker-compose.yml (the single-instance default
# used for local/basic use), not a replacement for it — run one or the
# other, not both, to avoid port/container-name collisions.

x-mcp-service: &mcp-service
  build: .
  command: ["python", "-m", "data_eyes_mcp.cli", "--transport", "http", "--bind", "0.0.0.0:8080"]
  networks:
    - data-eyes-net
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 10s

services:
  data-eyes-mcp-dev:
    <<: *mcp-service
    container_name: data-eyes-mcp-dev
    env_file:
      - .env.dev
    ports:
      - "8081:8080"

  data-eyes-mcp-staging:
    <<: *mcp-service
    container_name: data-eyes-mcp-staging
    env_file:
      - .env.staging
    ports:
      - "8082:8080"

  data-eyes-mcp-prod1:
    <<: *mcp-service
    container_name: data-eyes-mcp-prod1
    env_file:
      - .env.prod1
    ports:
      - "8083:8080"

  data-eyes-mcp-prod2:
    <<: *mcp-service
    container_name: data-eyes-mcp-prod2
    env_file:
      - .env.prod2
    ports:
      - "8084:8080"

networks:
  data-eyes-net:
    external: true
