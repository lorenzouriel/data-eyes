[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-eyes-mcp"
version = "0.1.0"
description = "Production-ready MCP server for SQL Server database access — the MCP layer of the Data Eyes toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Lorenzo", email = "lorenzouriel394@gmail.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "sql-server",
    "database",
    "langchain",
    "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
]

dependencies = [
    "mcp>=1.28,<2",  # 2.0 removed mcp.server.fastmcp (used by this server)
    "pyodbc>=4.0.35",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "prometheus-client>=0.19.0",
    "python-json-logger>=2.0.7",
    "asyncpg>=0.29.0",  # repository_tools.py's optional dashboard-repository trend tools
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "httpx>=0.25.0",
    "testcontainers>=3.7.0",
]

docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
]

monitoring = [
    "sentry-sdk>=1.38.0",
]

[project.scripts]
data-eyes-mcp = "data_eyes_mcp.cli:run"

[project.urls]
Homepage = "https://github.com/lorenzouriel/data-eyes"
Repository = "https://github.com/lorenzouriel/data-eyes.git"
"Bug Tracker" = "https://github.com/lorenzouriel/data-eyes/issues"

[tool.setuptools]
packages = ["data_eyes_mcp"]
package-dir = { "" = "src" }

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=src/data_eyes_mcp --cov-report=term-missing"
