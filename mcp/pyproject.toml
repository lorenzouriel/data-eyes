[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-eyes-mcp"
version = "0.2.0"
description = "MCP server exposing collector-backed Prometheus monitoring tools for the Data Eyes fleet"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Lorenzo", email = "lorenzouriel394@gmail.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "sql-server",
    "database",
    "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
]

dependencies = [
    "mcp>=1.28,<2",  # 2.0 removed mcp.server.fastmcp (used by this server)
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "uvicorn>=0.24.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.scripts]
data-eyes-mcp = "data_eyes_mcp.main:run"

[project.urls]
Homepage = "https://github.com/lorenzouriel/data-eyes"
Repository = "https://github.com/lorenzouriel/data-eyes.git"
"Bug Tracker" = "https://github.com/lorenzouriel/data-eyes/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["data_eyes_mcp*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C4", "B"]
ignore = ["E501"]  # long SQL strings

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
