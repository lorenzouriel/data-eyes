services:
  data-eyes-mcp-dev:
    build: .
    image: data-eyes-mcp
    container_name: data-eyes-mcp-dev
    # The image defaults to stdio transport; run HTTP for a networked container.
    command: ["python", "-m", "data_eyes_mcp.cli", "--transport", "http", "--bind", "0.0.0.0:8080"]
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - path: .env
      - path: .env.dev
        required: false
    environment:
      INSTANCES_FILE: /app/instances.yaml
      DEPLOYMENT_ENVIRONMENT: development
      INSTANCE_ALLOWLIST: dev
      STAGING_MSSQL_USER: ""
      STAGING_MSSQL_PASSWORD: ""
      PROD_MSSQL_USER: ""
      PROD_MSSQL_PASSWORD: ""
    volumes:
      - ../instances.yaml:/app/instances.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
