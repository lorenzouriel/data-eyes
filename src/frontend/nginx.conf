server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 128k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Resolve Compose service names through Docker's embedded DNS at request
    # time. Otherwise nginx keeps a stale IP after the backend is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Behind the Caddy gateway $remote_addr is the gateway container. Trust
    # X-Forwarded-For only from private (Docker network) peers so X-Real-IP
    # below carries the real client address for per-IP login limits.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    location / {
        try_files $uri /index.html;
    }

    # Same-origin proxy to the backend so the session cookie works without
    # CORS in production — see src/backend/app/config.py CORS_ALLOW_ORIGINS,
    # which is only needed for the separate-origin Vite dev server.
    location /api/ {
        set $dashboard_backend dashboard-backend:8090;
        proxy_pass http://$dashboard_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cookie_path / /;
        proxy_buffering off;
        proxy_read_timeout 130s;
    }
}
