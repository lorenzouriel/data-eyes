# Copy this file to instances.yaml and replace the placeholders locally.
# Never commit production credentials.

# MCP authorization is default-deny. Principals are asserted by a trusted proxy
# (HTTP) or DEFAULT_PRINCIPAL (stdio/local). This is authorization, not authentication.
mcp_security:
  principals:
    development-agent:
      tools: ["*"]
      instances: ["dev"]
      objects:
        - databases: ["master"]
          schemas: ["*"]
          tables: ["*"]
          columns: ["*"]
    staging-agent:
      tools:
        - list_configured_instances
        - list_databases
        - list_schemas
        - list_tables
        - describe_table
        - schema_discovery
        - get_relationships
        - get_database_info
        - get_policy_info
        - check_db_connection
        - wait_stats
        - missing_indexes
        - unused_indexes
        - stale_statistics
        - index_fragmentation
        - top_queries
        - db_space
        - backup_health
        - checkdb_health
        - blocking_snapshot
        - ag_health
        - job_health
        - fleet_health_score
      instances: ["staging"]
      objects:
        - databases: ["master"]
          schemas: ["*"]
          tables: ["*"]
          columns: ["*"]
    production-agent:
      tools:
        - list_configured_instances
        - list_databases
        - get_database_info
        - get_policy_info
        - check_db_connection
        - wait_stats
        - missing_indexes
        - unused_indexes
        - stale_statistics
        - index_fragmentation
        - top_queries
        - db_space
        - backup_health
        - checkdb_health
        - blocking_snapshot
        - ag_health
        - job_health
        - fleet_health_score
      instances: ["prod"]
      objects:
        - databases: ["master"]
          schemas: ["*"]
          tables: ["*"]
          columns: ["*"]

instances:
  - name: prod
    credential_env_prefix: PROD
    label: "Prod SQL Server"
    environment: production
    mssql_connection_string: "Driver={ODBC Driver 17 for SQL Server};Server=prod-server,1433;Database=master;UID=user;PWD=change-me;TrustServerCertificate=yes"
  - name: staging
    credential_env_prefix: STAGING
    label: "Staging SQL Server"
    environment: staging
    mssql_connection_string: "Driver={ODBC Driver 17 for SQL Server};Server=staging-server,1433;Database=master;UID=user;PWD=change-me;TrustServerCertificate=yes"
  - name: dev
    credential_env_prefix: DEV
    label: "Dev SQL Server"
    environment: development
    mssql_connection_string: "Driver={ODBC Driver 17 for SQL Server};Server=localhost,1433;Database=master;UID=user;PWD=change-me;TrustServerCertificate=yes"
