name: Security checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y unixodbc
      - run: uv run --project collector --frozen python -c "import app.main"
      - run: uv run --project mcp --frozen --extra dev pytest mcp/tests -q
      - run: docker run --rm --entrypoint promtool -v "$PWD/prometheus:/etc/prometheus:ro" prom/prometheus:v3.13.4 check config /etc/prometheus/prometheus.yml
      - run: docker build -t data-eyes-collector-test collector
      - run: docker build -t data-eyes-mcp-test mcp
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: |
          uv export --project collector --frozen --no-dev --no-emit-project --format requirements-txt > /tmp/collector.txt
          uv export --project mcp --frozen --no-dev --no-emit-project --format requirements-txt > /tmp/mcp.txt
          uvx pip-audit --disable-pip -r /tmp/collector.txt
          uvx pip-audit --disable-pip -r /tmp/mcp.txt
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
