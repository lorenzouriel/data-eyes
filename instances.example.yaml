# Copy this file to instances.yaml and replace the placeholders locally.

mcp_security:
  principals:
    development-agent:
      tools: ["*"]
      instances: ["dev"]
    staging-agent:
      tools:
        - list_configured_instances
        - list_databases
        - list_schemas
        - list_tables
        - describe_table
        - schema_discovery
        - get_relationships
        - get_database_info
        - check_db_connection
        - wait_stats
        - missing_indexes
        - unused_indexes
        - stale_statistics
        - index_fragmentation
        - top_queries
        - db_space
        - backup_health
        - checkdb_health
        - blocking_snapshot
        - ag_health
        - job_health
        - fleet_health_score
      instances: ["staging"]
    production-agent:
      tools:
        - list_configured_instances
        - list_databases
        - get_database_info
        - check_db_connection
        - wait_stats
        - missing_indexes
        - unused_indexes
        - stale_statistics
        - index_fragmentation
        - top_queries
        - db_space
        - backup_health
        - checkdb_health
        - blocking_snapshot
        - ag_health
        - job_health
        - fleet_health_score
      instances: ["prod"]

instances:
  - name: prod
    credential_env_prefix: PROD
    label: "Prod SQL Server"
    environment: production
    mssql_connection_string: "Driver={ODBC Driver 18 for SQL Server};Server=prod-server,1433;Database=master;UID=user;PWD=change-me;Encrypt=yes;TrustServerCertificate=no"
  - name: staging
    credential_env_prefix: STAGING
    label: "Staging SQL Server"
    environment: staging
    mssql_connection_string: "Driver={ODBC Driver 18 for SQL Server};Server=staging-server,1433;Database=master;UID=user;PWD=change-me;Encrypt=yes;TrustServerCertificate=no"
  - name: dev
    credential_env_prefix: DEV
    label: "Dev SQL Server"
    environment: development
    mssql_connection_string: "Driver={ODBC Driver 18 for SQL Server};Server=localhost,1433;Database=master;UID=user;PWD=change-me;Encrypt=yes;TrustServerCertificate=no"
