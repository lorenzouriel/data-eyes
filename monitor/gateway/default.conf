# Same-origin Grafana + authenticated Streamlit. TLS terminates at the existing
# external proxy, which must forward Host, X-Forwarded-Proto and WebSocket headers.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}
server {
    listen 3000;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $grafana http://grafana:3000;
    set $assistant http://agent-ui:8501;

    location = /_assistant_auth {
        internal;
        proxy_pass $grafana/api/user;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location = /assistant { return 302 /assistant/; }
    location /assistant/ {
        auth_request /_assistant_auth;
        # Rotate Grafana's session cookie if the authentication subrequest does.
        auth_request_set $session_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $session_cookie always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Frame-Options SAMEORIGIN always;
        proxy_pass $assistant;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass $grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
