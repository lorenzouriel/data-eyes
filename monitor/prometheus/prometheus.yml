global:
  scrape_interval: 30s
  evaluation_interval: 30s
# Recording rules only. Alerting is done by Grafana
# (monitor/grafana/alerting/data-eyes-alerts.yml), which queries this Prometheus.
rule_files:
- /etc/prometheus/rules/*.yml
scrape_configs:
- job_name: data-eyes
  static_configs:
  - targets:
    - collector:8090
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
