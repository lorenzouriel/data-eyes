apiVersion: 1

providers:
  - name: 'Data Eyes'
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      # monitor/grafana/dashboards, mounted read-only by docker-compose.yml.
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: true
