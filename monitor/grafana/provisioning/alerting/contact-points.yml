apiVersion: 1

# NOTIFICATION CONTACTS
contactPoints:
  - orgId: 1
    name: grafana-default-email
    receivers:
      - uid: begcbwa87905cf
        type: email
        settings:
          addresses: ${GRAFANA_NOTIFICATION_ADDRESSES}
          singleEmail: false
        disableResolveMessage: false

# NOTIFICATION POLICY
# One message per alert rule and SQL Server, repeated every 4 h while it keeps firing.
policies:
  - orgId: 1
    receiver: grafana-default-email
    group_by: ['grafana_folder', 'alertname', 'sql_instance']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
