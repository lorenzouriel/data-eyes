# Data Eyes — Threshold Registry
#
# Single source of truth for every severity threshold used across the toolkit:
# the upgraded .claude/resources/performance/additional_queries/*.json.sql scripts, the new
# .claude/resources/maintenance/diagnostics/*.sql scripts, the MCP dba_tools, and (later) the
# dashboard's health_score.py rollup all read from THIS file's values.
#
# Do not hardcode a different copy of these numbers elsewhere. If a SQL script's
# CASE WHEN literal needs to change, change it here first, then propagate.
#
# Thresholds marked "heuristic" have no documented industry-standard value in
# .claude/resources/performance/README.md — they are reasonable engineering defaults, tune them
# per environment rather than treating them as gospel.

memory:
  page_life_expectancy_seconds:
    warning: 300        # PLE below this = memory pressure (.claude/resources/performance/README.md Step 5)
  buffer_cache_hit_pct:
    warning: 95          # below this = memory pressure (.claude/resources/performance/README.md Step 5)
  memory_grants_pending:
    warning: 1            # sustained > 0 = queries starved for memory grant

io:
  data_file_latency_ms:
    ok: 10
    warning: 20            # >20ms = poor (.claude/resources/performance/README.md Step 7)
  log_file_latency_ms:
    ok: 5
    warning: 10            # >10ms = poor (.claude/resources/performance/README.md Step 7)

cpu:
  sustained_pct:
    warning: 80            # sustained CPU > 80% (.claude/resources/performance/README.md Step 6)

index:
  fragmentation_pct:
    reorganize: 5          # 5-30% = REORGANIZE (.claude/resources/performance/README.md Step 2 / workbook Index_Maintenance)
    rebuild: 30             # >30% = REBUILD
  stats_staleness_days:
    warning: 30             # documented in .claude/resources/performance/README.md Step 2
  missing_index_impact_score:
    # heuristic — avg_user_impact * (user_seeks + user_scans), no documented
    # industry threshold exists; tune per workload volume.
    warning: 10000
    critical: 100000
  unused_index_update_cost:
    # heuristic — zero reads + this many writes means pure maintenance overhead
    warning: 1
    critical: 10000

waits:
  # heuristic — % of total wait time attributable to a single wait type
  percentage_of_total:
    warning: 10
    critical: 25
  blocking_duration_seconds:
    warning: 30             # closes the "no live blocking diagnostic" gap
    critical: 120

maintenance:
  backup:
    full_backup_age_hours:
      warning: 24            # matches the 24h/daily FULL backup cadence in .claude/resources/maintenance/playbook.sql
      critical: 48
    log_backup_age_minutes:
      # only applies to FULL/BULK_LOGGED recovery model databases; matches the
      # 30-minute LOG backup cadence in .claude/resources/maintenance/playbook.sql
      warning: 60
      critical: 240
  checkdb:
    staleness_days:
      warning: 7
      critical: 14
  jobs:
    failure_lookback_days: 7   # window used to compute "failures in last N days"

availability_groups:
  # heuristic — sustained non-zero queue size indicates the secondary is falling
  # behind; exact values are network/workload dependent, tune per environment.
  redo_queue_kb:
    warning: 51200            # 50 MB
    critical: 512000           # 500 MB
  log_send_queue_kb:
    warning: 51200
    critical: 512000

query_performance:
  # avg elapsed time per execution — the warning tier is heuristic, the
  # critical tier deliberately matches monitor/docs/other_metrics.md's
  # existing "Slow Query Alerts (> 30s)" language rather than inventing a
  # new number.
  avg_duration_ms:
    warning: 5000
    critical: 30000

storage:
  # heuristic — drive free space remaining; wildly environment-dependent
  # (a 100GB drive and a 10TB SAN LUN need different alarms), tune per host.
  drive_free_space_gb:
    warning: 20
    critical: 5

alerts:
  # Defaults for the dashboard's alert catalog (backend/app/modules/alerts/catalog.py).
  # Users override them per alert and per instance on the Alerts page.
  # backend/tests/modules/alerts/test_alert_catalog.py fails if these drift
  # from the catalog. direction: above = alert when the value rises to the
  # threshold; below = alert when it falls to it. Alerts with no numeric
  # threshold (fixed severity, such as a SUSPECT database) are not listed.
  # Availability
  ag_health: {unit: "KB", direction: above, warning: 51200, critical: 512000}
  ag_data_loss_risk: {unit: "seconds", direction: above, warning: 60, critical: 300}
  log_shipping_latency: {unit: "minutes", direction: above, warning: 60, critical: 240}
  # Backup & integrity
  full_backup_age: {unit: "hours", direction: above, warning: 24, critical: 48}
  log_backup_age: {unit: "minutes", direction: above, warning: 60, critical: 240}
  checkdb_age: {unit: "days", direction: above, warning: 7, critical: 14}
  page_corruption: {unit: "pages", direction: above, warning: null, critical: 1}
  # Storage
  disk_space: {unit: "GB", direction: below, warning: 20, critical: 5}
  transaction_log_health: {unit: "%", direction: above, warning: 75, critical: 90}
  maxsize_growth: {unit: "%", direction: above, warning: 80, critical: 90}
  database_growth: {unit: "%/day", direction: above, warning: 10, critical: 25}
  slow_file_growth: {unit: "ms", direction: above, warning: 1000, critical: 10000}
  vlf_count: {unit: "VLFs", direction: above, warning: 1000, critical: 5000}
  io_pending: {unit: "ms", direction: above, warning: 5000, critical: 15000}
  slow_disk: {unit: "ms", direction: above, warning: 20, critical: 50}
  # Tempdb
  tempdb_data_utilization: {unit: "%", direction: above, warning: 85, critical: 95}
  tempdb_version_store: {unit: "%", direction: above, warning: 30, critical: 50}
  tempdb_log_usage: {unit: "%", direction: above, warning: 70, critical: 90}
  tempdb_contention: {unit: "tasks", direction: above, warning: 5, critical: 20}
  # Performance
  cpu_utilization: {unit: "%", direction: above, warning: 80, critical: 95}
  memory_available: {unit: "MB", direction: below, warning: 2048, critical: 512}
  page_life_expectancy: {unit: "seconds", direction: below, warning: 300, critical: 100}
  memory_grants_pending: {unit: "queries", direction: above, warning: 1, critical: 5}
  threadpool_exhaustion: {unit: "%", direction: above, warning: 80, critical: 95}
  blocking: {unit: "seconds", direction: above, warning: 30, critical: 120}
  long_running_process: {unit: "seconds", direction: above, warning: 600, critical: 3600}
  slow_queries: {unit: "ms", direction: above, warning: 5000, critical: 30000}
  query_regression: {unit: "queries", direction: above, warning: 1, critical: 10}
  login_failed: {unit: "logins", direction: above, warning: 5, critical: 50}
  # Maintenance
  index_fragmentation: {unit: "%", direction: above, warning: 30, critical: 60}
  stale_statistics: {unit: "days", direction: above, warning: 30, critical: 60}
  identity_values: {unit: "%", direction: above, warning: 80, critical: 90}
  version_support: {unit: "days", direction: below, warning: 365, critical: 0}
  # Configuration & security
  certificate_expiry: {unit: "days", direction: below, warning: 30, critical: 7}
  # Data Eyes
  notification_delivery_failing: {unit: "failures", direction: above, warning: 1, critical: 3}
